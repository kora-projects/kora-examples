name: Build Master

on:
  push:
    branches:
      - "master"

permissions:
  contents: read

jobs:
  build-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ "25" ]
        type: [ "Examples", "Guides" ]
        lang: [ "Java", "Kotlin" ]
        feature: [ "Database", "Client", "Server", "Graalvm", "Kafka", "Other" ]
        exclude:
          - type: "Examples"
            lang: "Kotlin"
            feature: "Graalvm"
          - type: "Guides"
            feature: "Graalvm"
    name: Master Java ${{ matrix.java }} for ${{ matrix.type }}-${{ matrix.lang }}-${{ matrix.feature }}
    env:
      GRADLE_TASK_SUFFIX: ${{ matrix.type }}${{ matrix.lang }}${{ matrix.feature }}
      MAX_PARALLEL_WORKERS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JDK setup
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Gradle run tests
        run: "./gradlew test${{ env.GRADLE_TASK_SUFFIX }} --no-daemon --no-parallel --console=plain"
