plugins {
    id "java"
}

// rewrite-java-21 is the newest parser OpenRewrite 8.56 ships, and it has to run on a JVM
// of the same generation as the sources it parses
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform("org.openrewrite.recipe:rewrite-recipe-bom:3.10.1")

    // ChangePackage / ChangeType
    testImplementation "org.openrewrite:rewrite-java"
    testRuntimeOnly "org.openrewrite:rewrite-java-21"
    // ChangeDependency over build files
    testImplementation "org.openrewrite:rewrite-maven"
    testImplementation "org.openrewrite.recipe:rewrite-java-dependencies"
    // loads the declarative recipes from META-INF/rewrite
    testImplementation "org.openrewrite:rewrite-yaml"
    testImplementation "org.openrewrite:rewrite-test"

    testImplementation platform("org.junit:junit-bom:6.1.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging {
        def isCiBuild = providers.environmentVariable("CI").map { it.toBoolean() }.orElse(false).get()
        if (isCiBuild) {
            showStandardStreams(false)
            events("failed")
        } else {
            showStandardStreams(true)
            events("passed", "skipped", "failed")
        }
        exceptionFormat = "full"
    }
}
