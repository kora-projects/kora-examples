s3client.aws {
  url = ${S3_URL}
  requestTimeout = 5s

  credentials {
    accessKey = ${S3_ACCESS_KEY}
    secretKey = ${S3_SECRET_KEY}
  }
}


my.bucket = ${S3_BUCKET}


httpClient {
  connectTimeout = "5s"
  readTimeout = "5s"
}


logging.level {
  "root": "WARN"
  "io.koraframework": "DEBUG"
  "io.koraframework.example": "DEBUG"
}
