resilient {
  circuitbreaker {
    # 2.0 does not merge a named section with `default` — the spec points at one explicit path,
    # so every required value has to be present here
    my_cb {
      type = FIXED_WINDOW
      countBased.windowSize = 1
      minimumRequiredCalls = 1
      failureRateThreshold = 100
      permittedCallsInHalfOpenState = 1
      waitDurationInOpenState = 1s
    }
  }
  timeout {
    default {
      duration = 500ms
    }
  }
  retry {
    default {
      delay = 100ms
      attempts = 2
    }
  }
}


logging.levels {
  "root": "WARN"
  "io.koraframework": "INFO"
  "io.koraframework.example": "INFO"
}
