services:
  rustfs:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    ports:
      - '9000:9000'
    environment:
      RUSTFS_ACCESS_KEY: rustfs
      RUSTFS_SECRET_KEY: rustfs123
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/health']
      interval: 30s
      timeout: 20s
      retries: 3
