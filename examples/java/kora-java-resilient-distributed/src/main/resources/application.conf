httpServer {
    port = 8080
    port = ${?HTTP_PORT}
    system.port = 8085
    system.port = ${?SYSTEM_PORT}
}
logging.levels.root = INFO

lettuce {
    uri = "redis://localhost:6379"
    uri = ${?REDIS_URL}
    commandTimeout = 2s
}
resilient.ratelimiter.shared {
    keyPrefix = "distributed-example"
    keyPrefix = ${?KEY_PREFIX}
    limitForPeriod = 4
    limitRefreshPeriod = 1h
    algorithm = FIXED_WINDOW
}
distributedRetryBudget {
    keyPrefix = ${resilient.ratelimiter.shared.keyPrefix}":budget"
    bucketTtl = 1h
}
resilient.retry.partner {
    attempts = 3
    delay = 1ms
    retryBudget {
        enabled = true
        ratio = 1.0
        tokensMax = 4
        tokensInitial = 2
    }
}
