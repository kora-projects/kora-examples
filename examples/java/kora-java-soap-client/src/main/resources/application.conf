soapClient.SimpleService {
  url = ${SOAP_CLIENT_URL}
  timeout = 30s
  telemetry.logging.enabled = true
}

httpClient.default {
  requestTimeout = 10s
  getValuesConfig {
    requestTimeout = 20s
  }
}

logging.level {
  "root": "WARN"
  "io.koraframework": "INFO"
  "io.koraframework.example": "INFO"
  "io.koraframework.example.generated.soap.SimpleService": "DEBUG"
}
