my {
  endpoint = ${S3_URL}
  bucket = ${S3_BUCKET}

  credentials {
    accessKey = ${S3_ACCESS_KEY}
    secretKey = ${S3_SECRET_KEY}
  }
}


httpClient {
  connectTimeout = "5s"
  readTimeout = "5s"
}


logging.level {
  "root": "WARN"
  "io.koraframework": "DEBUG"
  "io.koraframework.example": "DEBUG"
}
