resilient {
  circuitbreaker {
    default {
      type = FIXED_WINDOW
      countBased.windowSize = 2
      minimumRequiredCalls = 2
      failureRateThreshold = 100
      permittedCallsInHalfOpenState = 1
      waitDurationInOpenState = 1s
    }
    my_cb {
      type = FIXED_WINDOW
      countBased.windowSize = 1
      minimumRequiredCalls = 1
    }
  }
  timeout {
    default {
      duration = 500ms
    }
  }
  retry {
    default {
      delay = 100ms
      attempts = 2
    }
  }
}


logging.levels {
  "root": "WARN"
  "io.koraframework": "INFO"
  "io.koraframework.example": "INFO"
}
