httpServer {
  port = 8080
  system.port = 8085
  system.livenessPath = "/liveness"
  system.readinessPath = "/readiness"
  telemetry.logging.enabled = true
}

tracing {
  exporter {
    endpoint = ${METRIC_COLLECTOR_ENDPOINT}
    exportTimeout = "250s"
    scheduleDelay = "50ms"
    maxExportBatchSize = 10000
  }
  attributes {
    "service.name" = "kora-java-telemetry"
    "service.namespace" = "kora"
  }
}

jdbc {
  jdbcUrl = ${POSTGRES_JDBC_URL}
  username = ${POSTGRES_USER}
  password = ${POSTGRES_PASS}
  maxPoolSize = 4
  poolName = "telemetry"
  telemetry.tracing.enabled = true
}


logging.levels {
  "root": "WARN"
  "io.koraframework": "INFO"
  "io.koraframework.example": "INFO"
}
