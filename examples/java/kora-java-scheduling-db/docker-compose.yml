services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: example
      POSTGRES_USER: example
      POSTGRES_PASSWORD: example
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d example"]
      interval: 1s
      timeout: 3s
      retries: 30
