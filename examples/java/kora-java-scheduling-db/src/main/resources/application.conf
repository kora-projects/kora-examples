httpServer {
    port = 8080
    port = ${?HTTP_PORT}
    system.port = 8085
    system.port = ${?SYSTEM_PORT}
}
logging.levels.root = INFO

jdbc {
    jdbcUrl = "jdbc:postgresql://localhost:5432/example"
    jdbcUrl = ${?POSTGRES_JDBC_URL}
    username = "example"
    password = "example"
    maxPoolSize = 4
    poolName = "scheduler-example"
}
flyway.locations = ["classpath:db/migration"]

scheduling.dbScheduler {
    tableInitialize = false
    executionParallelism = 1
    shutdownWait = 10s
    polling { interval = 1s }
}
jobs.tick {
    enabled = true
    enabled = ${?JOB_ENABLED}
    delay = 1s
}
