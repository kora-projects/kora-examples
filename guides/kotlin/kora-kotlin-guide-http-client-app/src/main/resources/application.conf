httpServer {
  port = 8081
  system.port = 8086
  telemetry.logging.enabled = true
}

httpClient {
  userApi {
    url = "http://localhost:8080"
    url = ${?USER_API_URL}
    requestTimeout = 10s
  }
  telemetry.logging.enabled = true
}

logging {
  levels {
    "ROOT": "INFO"
    "io.koraframework": "INFO"
  }
}

