httpServer {
  port = 8081
  system.port = 8086
  telemetry.logging.enabled = true
}

grpcClient {
  UserService {
    url = "http://localhost:8090"
    url = ${?GRPC_SERVER_URL}
    telemetry.logging.enabled = true
  }
}

logging {
  levels {
    "ROOT": "INFO"
    "io.koraframework": "INFO"
    "io.koraframework.guide.grpcclient": "INFO"
  }
}
