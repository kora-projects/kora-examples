httpServer {
  port = 8080
  system.port = 8085
  telemetry.logging.enabled = true
}

resilient {
  retry {
    default {
      delay = 20ms
      attempts = 3
      delayStep = 20ms
    }
  }
  timeout {
    default {
      duration = 100ms
    }
  }
  circuitbreaker {
    default {
      type = FIXED_WINDOW
      countBased.windowSize = 2
      minimumRequiredCalls = 2
      failureRateThreshold = 100
      permittedCallsInHalfOpenState = 1
      waitDurationInOpenState = 200ms
    }
  }
}

logging {
  levels {
    "ROOT": "WARN"
    "io.koraframework": "INFO"
  }
}
