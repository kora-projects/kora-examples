httpServer {
  port = 8080
  system.port = 8085
  telemetry.logging.enabled = true
}

# s3-client-aws: the AWS SDK client, used here only for bucket administration
s3client.aws {
  url = ${S3_URL}
  region = "us-east-1"
  region = ${?S3_REGION}

  credentials {
    accessKey = ${S3_ACCESS_KEY}
    secretKey = ${S3_SECRET_KEY}
  }
}

# s3-client-kora: the declarative @S3.Client, path taken from its @S3.Client annotation
s3client.uploads {
  endpoint = ${S3_URL}
  region = "us-east-1"
  region = ${?S3_REGION}

  bucket = "uploads"
  bucket = ${?S3_BUCKET}

  credentials {
    accessKey = ${S3_ACCESS_KEY}
    secretKey = ${S3_SECRET_KEY}
  }
}

logging {
  levels {
    "ROOT": "WARN"
    "io.koraframework": "INFO"
  }
}