httpServer {
  port = 8080
  system.port = 8085
  system.metricsPath = "/metrics"
  system.livenessPath = "/system/liveness"
  system.readinessPath = "/system/readiness"
  telemetry.logging.enabled = true
  // в 2.0 telemetry.metrics.enabled по умолчанию false — без этого /metrics отдаёт только JVM-метрики
  telemetry.metrics.enabled = true
}

tracing {
  exporter {
    endpoint = "http://localhost:4318/v1/traces"
    exportTimeout = "5s"
    scheduleDelay = "1s"
    maxExportBatchSize = 512
    maxQueueSize = 2048
  }
  attributes {
    "service.name" = "guide-observability-app"
    "service.namespace" = "kora-guide"
  }
}

logging {
  levels {
    "ROOT": "WARN"
    "io.koraframework": "INFO"
    "io.koraframework.guide.observability": "DEBUG"
  }
}
